<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%3E<text y=%2226%22 font-size=%2224%22>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme before first paint (dark | l1..l5)
      (function () {
        try {
          var t = localStorage.getItem('ms-theme');
          if (t && ['dark', 'l1', 'l2', 'l3', 'l4', 'l5'].indexOf(t) !== -1) document.documentElement.dataset.theme = t;
        } catch (e) { /* storage unavailable */ }
      })();
    </script>
    <title>Market Scanner 360 — Multi-Asset Intelligence & Money Line Engine</title>
    <meta name="description" content="Professional 360° multi-asset scanner for Crypto, US Stocks & Precious Metals with deterministic Money Line engine, technical analysis tools, and AI Briefing." />
  </head>
  <body class="bg-background text-slate-100 antialiased min-h-screen selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
