steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/crypto-scanner-web:$COMMIT_SHA'
      - '-t'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/crypto-scanner-web:latest'
      - '.'

  # 2. Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/crypto-scanner-web'

  # 3. Deploy to Cloud Run (isolated from RelayHub)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'market-scanner-360'
      - '--image'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/crypto-scanner-web:$COMMIT_SHA'
      - '--region'
      - 'europe-west3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # update-env-vars preserves Secret Manager bindings and any operational
      # settings added outside this file. The alternate delimiter allows the
      # comma-separated source lists to remain single environment values.
      - '--update-env-vars'
      - '^|^NODE_ENV=production|FIREBASE_PROJECT_ID=gen-lang-client-0610749770|ALLOWED_EMAILS=marius.perju.juravle@gmail.com,smalbergher2@gmail.com,perjuruben@gmail.com,tiberioursan@gmail.com|ADMIN_EMAILS=marius.perju.juravle@gmail.com|GEMINI_MODEL=gemini-3.5-flash-lite|TELEGRAM_SOURCE_CHANNELS=cointelegraph,watcherguru,stockbot,financialjuice,econflash|BLUESKY_SEARCH_QUERIES=bitcoin,ethereum,stock market,gold market,NVDA,SPX,Federal Reserve'
      - '--update-secrets'
      - 'DAILY_SCAN_TOKEN=money-scanner-daily-scan-token:latest,TELEGRAM_WEBHOOK_SECRET=telegram-webhook-secret:latest'
      - '--timeout'
      - '900'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'

images:
  - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/crypto-scanner-web:$COMMIT_SHA'
  - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/crypto-scanner-web:latest'

timeout: '900s'
